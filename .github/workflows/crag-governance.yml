name: AI Governance Audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ai-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-audit:
    name: Crag AI Governance Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run AI Governance Audit
        # Antigravity targets will fall back to rule synchronization checks
        run: npx crag audit --strict
